name: Build Kombucha
on:
  workflow_dispatch:
    inputs:
      patchset:
        type: choice
        options:
          - stable
          - unstable
          - proton-unstable
      commit:
        type: string
        default: 455e3509b98a6919fd4ad1def4803e08c41c03b2
permissions:
  contents: write
  pull-requests: read
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Release Tag
        run: |
          case ${{ inputs.patchset }} in
            stable)
              echo "TAG=${{ inputs.patchset }}+$(date --utc +%Y%m%d%H%M%S)" >> $GITHUB_ENV ;;
            *)
              echo "TAG=${{ inputs.patchset }}" >> $GITHUB_ENV
          esac

      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            autoconf \
            binutils \
            bison \
            build-essential \
            ccache \
            flex \
            gettext \
            git \
            libfontconfig-dev \
            libfreetype-dev \
            libgl-dev \
            libgnutls28-dev \
            libpulse-dev \
            libudev-dev \
            libunwind-dev \
            libsdl2-dev \
            libv4l-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbregistry-dev \
            libxrandr-dev \
            libxrender-dev \
            linux-headers-generic-6.14 \
            wget

      - name: Setup NTSync header
        run: sudo cp /usr/src/linux-headers-6.14.*/include/uapi/linux/ntsync.h /usr/include/linux

      - name: Fetch latest LLVM toolchains
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          wget https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar xf ./llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64/bin:$GITHUB_PATH" >> $GITHUB_PATH

      - name: Fetch Sources
        run: |
          case ${{ inputs.patchset }} in
            proton-unstable)
              export ORGANIZATION="ValveSoftware" ;;
            *)
              export ORGANIZATION="wine-mirror"
          esac

          git clone https://github.com/${ORGANIZATION}/wine.git --depth 1 \
            --revision=${{ inputs.commit }}

      - name: Apply Patches
        run: |
          echo "INSTALL=$GITHUB_WORKSPACE/kombucha" >> $GITHUB_ENV

          git -C wine apply "$GITHUB_WORKSPACE"/patches/${{ inputs.patchset }}/*.patch

      - name: Apply Release Tag and Wine Commit
        run: sed -i -e "s/TAG/${{ env.TAG }}/" -e "s/WINE_COMMIT/${{ inputs.commit }}/" "$GITHUB_WORKSPACE"/wine/server/main.c

      # Compiler/linker flags:
      # https://gitlab.com/freedesktop-sdk/freedesktop-sdk/-/blob/master/include/flags.yml
      # Fortify is disabled:
      # https://bugs.winehq.org/show_bug.cgi?id=24606
      - name: Configure Wine
        working-directory: wine
        run: |
          case ${{ inputs.patchset }} in
            stable|unstable)
              export x86_64_CC="ccache x86_64-w64-mingw32-clang"
              export x86_64_CCX="ccache x86_64-w64-mingw32-clang++"
              export CC="ccache clang"
              export CXX="ccache clang++"
              export x86_64_LDFLAGS="-fuse-ld=lld" ;;
            *)
              export x86_64_CC="ccache x86_64-w64-mingw32-gcc"
              export x86_64_CCX="ccache x86_64-w64-mingw32-g++"
              export CC="ccache gcc"
              export CXX="ccache g++"
              export x86_64_LDFLAGS="-fuse-ld=ld"
          esac

          export x86_64_CFLAGS="-O2 -pipe -g0"
          export x86_64_CXXFLAGS="${x86_64_CFLAGS}"
          export CFLAGS="${x86_64_CFLAGS} -Wp,-D_FORTIFY_SOURCE=0 -Wp,-D_GLIBCXX_ASSERTIONS -fexceptions -fstack-protector-strong -grecord-gcc-switches -fasynchronous-unwind-tables -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
          export CXXFLAGS="${CFLAGS}"
          export x86_64_LDFLAGS="${x86_64_LDFLAGS} -Wl,--as-needed"
          export LDFLAGS="${x86_64_LDFLAGS} -Wl,-z,relro,-z,now"
          mkdir -p ${{ env.INSTALL }}
          [ ${{ inputs.patchset }} = proton-unstable ] && ./autogen.sh
          ./configure \
            --disable-dxdiagn \
            --disable-mscoree \
            --disable-mshtml \
            --disable-tests \
            --disable-win16 \
            --disable-winedbg \
            --disable-winemenubuilder \
            --enable-archs=x86_64 \
            --prefix=${{ env.INSTALL }} \
            --with-mingw \
            --without-alsa

      - name: Configure Ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Build Wine
        working-directory: wine
        run: make -j$(($(nproc) + 1))

      - name: Install Wine
        working-directory: wine
        run: make install-lib

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          export NAME="kombucha-${{ env.TAG }}"
          mv "${{ env.INSTALL }}" "${NAME}"
          rm -rf "${NAME}"/share/{applications,man}
          strip --strip-unneeded "${NAME}"/bin/* "${NAME}"/lib/wine/*/*
          XZ_OPT=-9 tar -Jcf "${NAME}.tar.xz" "${NAME}"

          case ${{ inputs.patchset }} in
            proton-unstable)
              export WINE_VERSION="Proton-Wine" ;;
            *)
              export WINE_VERSION="Wine"
          esac

          [ ${{ inputs.patchset }} = unstable ] || [ ${{ inputs.patchset }} = proton-unstable ] && gh release delete --cleanup-tag "${TAG}"
          gh release create --notes "Built from ${WINE_VERSION} commit ${{ inputs.commit }}." --prerelease --title "${TAG}" "${TAG}" "${NAME}.tar.xz"
