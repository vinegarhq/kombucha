      - name: Configure Ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Build Wine
        working-directory: wine
        run: make -j$(($(nproc) + 1))

      - name: Install Wine
        working-directory: wine
        run: make install-lib

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          export NAME="kombucha-${{ env.TAG }}"
          mv -v "${{ env.INSTALL }}" "${NAME}"
          rm -vrf "${NAME}"/share/{applications,man}
          strip -v --strip-unneeded "${NAME}"/bin/* "${NAME}"/lib/wine/*/*
          XZ_OPT=-9 tar -vJcf "${NAME}.tar.xz" "${NAME}"

          case ${{ inputs.patchset }} in
            proton)
              export WINE_VERSION="Proton-Wine" ;;
            *)
              export WINE_VERSION="Wine"
          esac

          [ ${{ inputs.patchset }} = proton ] && gh release delete --cleanup-tag "${TAG}"
          gh release create --notes "Built from ${WINE_VERSION} commit ${{ inputs.commit }}." --prerelease --title "${TAG}" "${TAG}" "${NAME}.tar.xz"
