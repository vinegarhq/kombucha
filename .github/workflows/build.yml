name: Build Kombucha
on:
  workflow_dispatch:
    inputs:
      patchset:
        type: choice
        options:
          - stable
          - proton
      commit:
        type: string
        default: 2528aff26208257fdbf980666a4f0e66d47563ce
permissions:
  contents: write
  pull-requests: read
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Release Tag
        run: |
          case ${{ inputs.patchset }} in
            stable)
              echo "TAG=${{ inputs.patchset }}+$(date --utc +%Y%m%d%H%M%S)" >> $GITHUB_ENV ;;
            *)
              echo "TAG=${{ inputs.patchset }}" >> $GITHUB_ENV
          esac

      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            autoconf \
            binutils \
            bison \
            build-essential \
            ccache \
            flex \
            gettext \
            git \
            libfontconfig-dev \
            libfreetype-dev \
            libgl-dev \
            libgnutls28-dev \
            libpulse-dev \
            libudev-dev \
            libunwind-dev \
            libsdl2-dev \
            libv4l-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbregistry-dev \
            libxrandr-dev \
            libxrender-dev \
            linux-headers-generic-6.14 \
            wget

      - name: Setup NTSync header
        run: sudo cp -v /usr/src/linux-headers-6.14.*/include/uapi/linux/ntsync.h /usr/include/linux

      - name: Fetch latest LLVM toolchains
        run: |
          export LLVM_MINGW_VERSION="20261104"

          wget -v https://apt.llvm.org/llvm.sh
          chmod -v +x llvm.sh
          sudo ./llvm.sh 23
          wget -v https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -vxf ./llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64/bin:$GITHUB_PATH" >> $GITHUB_PATH

      - name: Fetch Sources
        run: |
          case ${{ inputs.patchset }} in
            proton)
              export ORGANIZATION="ValveSoftware" ;;
            *)
              export ORGANIZATION="wine-mirror"
          esac

          git clone https://github.com/${ORGANIZATION}/wine.git --depth 1 \
            --revision=${{ inputs.commit }}

      - name: Apply Patches
        run: |
          echo "INSTALL=$GITHUB_WORKSPACE/kombucha" >> $GITHUB_ENV

          git -C wine apply "$GITHUB_WORKSPACE"/patches/${{ inputs.patchset }}/*.patch

      # Compiler/linker flags:
      # https://gitlab.com/freedesktop-sdk/freedesktop-sdk/-/blob/master/include/flags.yml
      # Fortify is disabled:
      # https://bugs.winehq.org/show_bug.cgi?id=24606
      - name: Configure Wine
        working-directory: wine
        run: |
          case ${{ inputs.patchset }} in
            stable)
              export x86_64_CC="ccache x86_64-w64-mingw32-clang"
              export x86_64_CCX="ccache x86_64-w64-mingw32-clang++"
              export CC="ccache clang"
              export CXX="ccache clang++"
              export x86_64_LDFLAGS="-fuse-ld=lld" ;;
            *)
              export x86_64_CC="ccache x86_64-w64-mingw32-gcc"
              export x86_64_CCX="ccache x86_64-w64-mingw32-g++"
              export CC="ccache gcc"
              export CXX="ccache g++"
              export x86_64_LDFLAGS="-fuse-ld=ld"
          esac

          export x86_64_CFLAGS="-O2 -pipe -g0"
          export x86_64_CXXFLAGS="${x86_64_CFLAGS}"
          export CFLAGS="${x86_64_CFLAGS} -Wp,-D_FORTIFY_SOURCE=0 -Wp,-D_GLIBCXX_ASSERTIONS -fexceptions -fstack-protector-strong -grecord-gcc-switches -fasynchronous-unwind-tables -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
          export CXXFLAGS="${CFLAGS}"
          export LDFLAGS="-Wl,--as-needed -Wl,-z,relro,-z,now"

          mkdir -vp ${{ env.INSTALL }}
          [ ${{ inputs.patchset }} = proton ] && ./autogen.sh
          ./configure \
            --enable-archs=x86_64 \
            --prefix=${{ env.INSTALL }} \
            --without-alsa \
